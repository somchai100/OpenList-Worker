name: Sync upstream

on:
  # 每天 UTC 02:00 执行
  schedule:
    - cron: "0 2 * * *"

  # 支持手动执行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/OpenListTeam/OpenList-Worker
          git fetch upstream

 
      - name: Sync upstream
        run: |
          git checkout main
          git merge upstream/main --no-edit
          git push origin main



